# fly.toml app configuration file generated for ai-glasses-for-research on 2026-07-29T15:23:17-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-glasses-for-research'
primary_region = 'ewr'

[build]
[env]
  STABILITY_MODE = 'true'
  ENABLE_YOLO = 'true'
  YOLO_SERVICE_URL = 'https://ai-glasses-yolo-perception.fly.dev'
  YOLO_CONFIDENCE = '0.25'
  YOLO_MIN_INTERVAL_SEC = '1.0'
  YOLO_REQUEST_TIMEOUT_SEC = '3.0'

[http_service]
  internal_port = 8081
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1

[http_service.concurrency]
  type = "connections"
  soft_limit = 20
  hard_limit = 25

[[vm]]
  cpu_kind = "performance"
  cpus = 4
  memory = "3gb"

[[mounts]]
  source = "test_logs"
  destination = "/data"
