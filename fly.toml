# fly.toml app configuration file generated for ai-glasses-for-research on 2026-07-29T15:23:17-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-glasses-for-research'
primary_region = 'ewr'

[build]
[env]
  STABILITY_MODE = 'true'

[http_service]
  internal_port = 8081
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1

[http_service.concurrency]
  type = "connections"
  soft_limit = 20
  hard_limit = 25

[[vm]]
  memory = '1gb'
  cpus = 2
  memory_mb = 1024
