# fly.toml app configuration file generated for ai-glasses-for-research on 2026-07-29T15:23:17-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-glasses-for-research'
primary_region = 'ewr'

[build]
[env]
  STABILITY_MODE = 'true'
  LATENCY_LOG_CSV = '/data/latency.csv'

[http_service]
  internal_port = 8081
  force_https = true
  # Runs only while someone is connected: the first request (the /test page,
  # the glasses, /trials) starts the machine in a few seconds, and Fly stops it
  # a few minutes after the last connection closes. Open websockets count as
  # connections, so it stays up for a whole trial. Scoring cut off by a stop is
  # resumed on the next start (_schedule_pending_trial_scores in app_main.py).
  auto_start_machines = true
  auto_stop_machines = 'stop'
  min_machines_running = 0

[http_service.concurrency]
  type = "connections"
  soft_limit = 20
  hard_limit = 25

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "1gb"

[[mounts]]
  source = "test_logs"
  destination = "/data"
